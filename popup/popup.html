<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>OCR AutoFill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo">✈</span>
      <h1>OCR AutoFill</h1>
    </header>

    <main>
      <section id="upload-section">
        <div id="drop-zone" style="cursor: default">
          <span class="drop-icon">📄</span>
          <p>Clique para selecionar uma imagem</p>
          <small>Abre numa aba separada para evitar bugs do Chrome</small>
          <button
            id="btn-open-upload"
            class="btn-primary"
            style="margin-top: 12px"
          >
            Selecionar imagem
          </button>
        </div>
      </section>

      <section id="result-section" class="hidden">
        <h2>Dados Extraídos</h2>

        <div class="field-group">
          <label for="field-nome">Nome</label>
          <input type="text" id="field-nome" placeholder="Nome(s)" />
        </div>

        <div class="field-group">
          <label for="field-sobrenome">Sobrenome</label>
          <input
            type="text"
            id="field-sobrenome"
            placeholder="Último sobrenome"
          />
        </div>

        <div class="field-group">
          <label for="field-cpf">CPF</label>
          <input
            type="text"
            id="field-cpf"
            placeholder="000.000.000-00"
            maxlength="14"
          />
        </div>

        <div class="field-group">
          <label for="field-data">Data de nascimento</label>
          <input
            type="text"
            id="field-data"
            placeholder="DD/MM/AAAA"
            maxlength="10"
          />
        </div>

        <button id="btn-inject" class="btn-primary">
          Preencher formulário
        </button>
      </section>

      <div id="status-bar" class="hidden"></div>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
