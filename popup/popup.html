<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>OCR Passagens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="../assets/icons/icon48.png" alt="OCR Passagens" />
      <h1>OCR Passagens</h1>
    </header>

    <main>
      <section id="upload-section">
        <div
          id="drop-zone"
          role="button"
          tabindex="0"
          aria-label="Abrir tela de OCR em nova aba"
        >
          <span class="drop-icon">📄</span>
          <p>Clique para abrir o OCR em nova aba</p>
          <small
            >A tela de leitura e validação abre separada para maior
            estabilidade</small
          >
          <button
            id="btn-open-upload"
            class="btn-primary"
            style="margin-top: 12px"
          >
            Abrir tela de OCR
          </button>
        </div>
      </section>

      <section id="result-section" class="hidden">
        <h2>Dados Extraídos</h2>

        <div class="field-group">
          <label for="field-nome">Nome</label>
          <input type="text" id="field-nome" placeholder="Nome(s)" />
        </div>

        <div class="field-group">
          <label for="field-sobrenome">Sobrenome</label>
          <input
            type="text"
            id="field-sobrenome"
            placeholder="Último sobrenome"
          />
        </div>

        <div class="field-group">
          <label for="field-cpf">CPF</label>
          <input
            type="text"
            id="field-cpf"
            placeholder="000.000.000-00"
            maxlength="14"
          />
        </div>

        <div class="field-group">
          <label for="field-data">Data de nascimento</label>
          <input
            type="text"
            id="field-data"
            placeholder="DD/MM/AAAA"
            maxlength="10"
          />
        </div>

        <div id="extra-fields" class="hidden">
          <div class="field-group">
            <label for="field-email">E-mail</label>
            <input
              type="email"
              id="field-email"
              placeholder="email@exemplo.com"
            />
          </div>

          <div class="field-group">
            <label for="field-telefone">Telefone</label>
            <input
              type="text"
              id="field-telefone"
              placeholder="(11) 99999-9999"
            />
          </div>
        </div>

        <button id="btn-inject" class="btn-primary">
          Preencher formulário
        </button>
        <button id="btn-clear-ocr" class="btn-secondary">
          Limpar último OCR
        </button>
      </section>

      <div id="status-bar" class="hidden"></div>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
