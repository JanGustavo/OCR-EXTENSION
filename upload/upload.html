<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>OCR AutoFill — Selecionar imagem</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2d3a;
        --accent: #6366f1;
        --success: #22c55e;
        --error: #ef4444;
        --text: #e2e8f0;
        --muted: #64748b;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 480px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 6px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 28px;
      }

      #drop-zone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      #drop-zone.drag-over {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.06);
      }
      #drop-zone:hover {
        border-color: var(--accent);
      }
      .icon {
        font-size: 40px;
        margin-bottom: 12px;
      }
      #drop-zone p {
        font-size: 14px;
        margin-bottom: 4px;
      }
      #drop-zone small {
        color: var(--muted);
        font-size: 12px;
      }

      #file-input {
        display: none;
      }

      #preview-box {
        display: none;
        margin-top: 20px;
        text-align: center;
      }
      #preview-box img {
        max-width: 100%;
        max-height: 260px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .btn {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn:hover {
        opacity: 0.88;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-secondary {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
      }

      #status {
        display: none;
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
      }
      #status.success {
        background: rgba(34, 197, 94, 0.12);
        color: var(--success);
      }
      #status.error {
        background: rgba(239, 68, 68, 0.12);
        color: var(--error);
      }

      .section {
        display: block;
      }
      .section.hidden {
        display: none;
      }

      #upload-section {
        margin-bottom: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }
      #upload-section.hidden {
        display: none;
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      #result-section input,
      #result-section select {
        display: block;
        width: 100%;
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      #result-section input:focus,
      #result-section select:focus {
        outline: none;
        border-color: var(--accent);
      }
      /* Cor dos options no select escuro */
      #result-section select option {
        background: var(--surface);
        color: var(--text);
      }
      #result-section label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
        margin-top: 10px;
      }

      /* ─── Passenger Tabs ─── */
      #passenger-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .passenger-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        height: 44px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .passenger-tab:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .passenger-tab.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
      }
      .passenger-tab.filled::after {
        content: "✓";
        margin-left: 4px;
        font-size: 11px;
        opacity: 0.8;
      }

      .spinner-wrap {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Badge de campos opcionais */
      .optional-badge {
        font-size: 10px;
        color: var(--muted);
        font-weight: 400;
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>✈ OCR AutoFill</h1>
      <p class="sub">
        Selecione ou arraste uma imagem com os dados do passageiro
      </p>

      <!-- ─── Upload Section ─── -->
      <div id="upload-section" class="section">
        <div id="drop-zone">
          <div class="icon">📄</div>
          <p>Arraste aqui ou clique para escolher</p>
          <small>PNG, JPG ou WEBP • máx. 5MB</small>
        </div>
        <input
          type="file"
          id="file-input"
          accept="image/png,image/jpeg,image/webp"
        />

        <div id="preview-box">
          <img id="preview-img" alt="Preview" />
          <button class="btn btn-secondary" id="btn-change">
            Trocar imagem
          </button>
        </div>

        <div class="spinner-wrap" id="spinner">
          <div class="spinner"></div>
          <span>Processando OCR...</span>
        </div>

        <div id="status"></div>
      </div>

      <!-- ─── Result Section ─── -->
      <div id="result-section" class="section">
        <div
          id="passenger-tabs"
          style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap"
        >
          <!-- Abas geradas por JS -->
        </div>

        <label>Nome Completo</label>
        <input
          type="text"
          id="field-nome"
          placeholder="Primeiro nome e sobrenome"
        />

        <label>CPF</label>
        <input type="text" id="field-cpf" placeholder="XXX.XXX.XXX-XX" />

        <label>Data de Nascimento</label>
        <input type="text" id="field-data" placeholder="DD/MM/YYYY" />

        <!--
          CAMPOS ADICIONADOS — Gênero e Nacionalidade
          Eram a causa do react-select de gênero nunca ser preenchido,
          pois o valor nunca chegava via storage.
        -->
        <label>
          Gênero
          <span class="optional-badge"
            >(opcional — preenche o select da Azul)</span
          >
        </label>
        <select id="field-genero">
          <option value="">Não informar</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
        </select>

        <label>
          Nacionalidade
          <span class="optional-badge">(padrão: Brasileira)</span>
        </label>
        <select id="field-nacionalidade">
          <option value="Brasileira">Brasileira</option>
          <option value="Americana">Americana</option>
          <option value="Portuguesa">Portuguesa</option>
          <option value="Argentina">Argentina</option>
          <option value="Outra">Outra</option>
        </select>

        <button class="btn btn-primary" id="btn-upload-more">
          + Adicionar outro passageiro
        </button>
        <button class="btn btn-secondary" id="btn-back">Voltar</button>
        <button
          class="btn btn-primary"
          id="btn-finish"
          style="background-color: #22c55e"
        >
          ✓ Finalizar e ir ao formulário
        </button>

        <div id="status"></div>
      </div>
    </div>

    <script src="upload.js" type="module"></script>
  </body>
</html>
