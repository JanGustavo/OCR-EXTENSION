<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>OCR Passagens</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2d3a;
        --accent: #6366f1;
        --success: #22c55e;
        --error: #ef4444;
        --text: #e2e8f0;
        --muted: #64748b;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 480px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 6px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 28px;
      }

      #drop-zone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      #drop-zone.drag-over {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.06);
      }
      #drop-zone:hover {
        border-color: var(--accent);
      }
      .icon {
        font-size: 40px;
        margin-bottom: 12px;
      }
      #drop-zone p {
        font-size: 14px;
        margin-bottom: 4px;
      }
      #drop-zone small {
        color: var(--muted);
        font-size: 12px;
      }

      #file-input {
        display: none;
      }

      #preview-box {
        display: none;
        margin-top: 20px;
        text-align: center;
      }
      #preview-box img {
        max-width: 100%;
        max-height: 260px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .btn {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn:hover {
        opacity: 0.88;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-secondary {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .btn-danger {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--error);
      }
      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.22);
      }

      #status {
        display: none;
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
      }
      #status.success {
        background: rgba(34, 197, 94, 0.12);
        color: var(--success);
      }
      #status.error {
        background: rgba(239, 68, 68, 0.12);
        color: var(--error);
      }

      .section {
        display: block;
      }
      .section.hidden {
        display: none;
      }

      #upload-section {
        margin-bottom: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }
      #upload-section.hidden {
        display: none;
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      #result-section input,
      #result-section select {
        display: block;
        width: 100%;
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      #result-section input:focus,
      #result-section select:focus {
        outline: none;
        border-color: var(--accent);
      }
      /* Cor dos options no select escuro */
      #result-section select option {
        background: var(--surface);
        color: var(--text);
      }
      #result-section label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
        margin-top: 10px;
      }

      .result-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .result-header h3 {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
      }

      .result-header small {
        color: var(--muted);
        font-size: 12px;
      }

      .passenger-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .passenger-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px 10px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: linear-gradient(
          180deg,
          rgba(26, 29, 39, 0.96),
          rgba(15, 17, 23, 0.96)
        );
        color: var(--text);
        cursor: pointer;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          box-shadow 0.16s ease;
        min-height: 118px;
        text-align: center;
      }

      .passenger-card:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }

      .passenger-card.active {
        border-color: var(--accent);
        box-shadow:
          0 0 0 1px rgba(99, 102, 241, 0.35),
          0 8px 22px rgba(0, 0, 0, 0.22);
      }

      .passenger-card.filled .card-status {
        background: rgba(34, 197, 94, 0.14);
        color: var(--success);
      }

      .passenger-card.empty .card-status {
        background: rgba(100, 116, 139, 0.14);
        color: var(--muted);
      }

      .passenger-card .thumb {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.22),
          rgba(34, 197, 94, 0.18)
        );
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-size: 18px;
        font-weight: 700;
      }

      .passenger-card .title {
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
      }

      .passenger-card .name {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        min-height: 28px;
        line-height: 1.35;
      }

      .passenger-card .card-status {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 4px 8px;
        border-radius: 999px;
      }

      .spinner-wrap {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Badge de campos opcionais */
      .optional-badge {
        font-size: 10px;
        color: var(--muted);
        font-weight: 400;
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="page-heading">✈ OCR Passagens</h1>
      <p class="sub">
        Selecione ou arraste uma imagem com os dados do passageiro
      </p>

      <!-- ─── Upload Section ─── -->
      <div id="upload-section" class="section">
        <div id="drop-zone">
          <div class="icon">📄</div>
          <p>Arraste aqui ou clique para escolher</p>
          <small>PNG, JPG ou WEBP • máx. 5MB</small>
        </div>
        <input
          type="file"
          id="file-input"
          accept="image/png,image/jpeg,image/webp"
        />

        <div id="preview-box">
          <img id="preview-img" alt="Preview" />
          <button class="btn btn-secondary" id="btn-change">
            Trocar imagem
          </button>
        </div>

        <div class="spinner-wrap" id="spinner">
          <div class="spinner"></div>
          <span>Processando OCR...</span>
        </div>

        <div id="status"></div>
      </div>

      <!-- ─── Result Section ─── -->
      <div id="result-section" class="section">
        <div class="result-header">
          <h3>Passageiros</h3>
          <small id="passenger-counter">0 de 9</small>
        </div>

        <div id="passenger-summary" class="passenger-summary"></div>

        <button class="btn btn-secondary" id="btn-select-image">
          Selecionar imagem do passageiro atual
        </button>

        <label>Nome Completo</label>
        <input
          type="text"
          id="field-nome"
          placeholder="Primeiro nome e sobrenome"
        />

        <label>CPF</label>
        <input type="text" id="field-cpf" placeholder="XXX.XXX.XXX-XX" />

        <label>Data de Nascimento</label>
        <input type="text" id="field-data" placeholder="DD/MM/YYYY" />

        <!--
          CAMPOS ADICIONADOS — Gênero e Nacionalidade
          Eram a causa do react-select de gênero nunca ser preenchido,
          pois o valor nunca chegava via storage.
        -->
        <label>
          Gênero
          <span class="optional-badge" id="genero-hint"
            >(opcional — preenche o select do provedor)</span
          >
        </label>
        <select id="field-genero">
          <option value="">Não informar</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
        </select>

        <label>
          Nacionalidade
          <span class="optional-badge">(padrão: Brasil)</span>
        </label>
        <select id="field-nacionalidade">
          <option value="Brasil">Brasil</option>
          <option value="Americana">Americana</option>
          <option value="Portuguesa">Portuguesa</option>
          <option value="Argentina">Argentina</option>
          <option value="Outra">Outra</option>
        </select>

        <button class="btn btn-primary" id="btn-upload-more">
          + Adicionar outro passageiro
        </button>
        <button class="btn btn-secondary" id="btn-back">Voltar</button>
        <button class="btn btn-danger" id="btn-clear-passenger">
          🗑 Limpar passageiro atual
        </button>
        <button
          class="btn btn-primary"
          id="btn-finish"
          style="background-color: #22c55e"
        >
          ✓ Finalizar e ir ao formulário
        </button>

        <div id="status"></div>
      </div>
    </div>

    <script src="upload.js" type="module"></script>
  </body>
</html>
