<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>OCR AutoFill — Selecionar imagem</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2d3a;
        --accent: #6366f1;
        --success: #22c55e;
        --error: #ef4444;
        --text: #e2e8f0;
        --muted: #64748b;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 480px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 6px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 28px;
      }

      #drop-zone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      #drop-zone.drag-over {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.06);
      }
      #drop-zone:hover {
        border-color: var(--accent);
      }
      .icon {
        font-size: 40px;
        margin-bottom: 12px;
      }
      #drop-zone p {
        font-size: 14px;
        margin-bottom: 4px;
      }
      #drop-zone small {
        color: var(--muted);
        font-size: 12px;
      }

      #file-input {
        display: none;
      }

      #preview-box {
        display: none;
        margin-top: 20px;
        text-align: center;
      }
      #preview-box img {
        max-width: 100%;
        max-height: 260px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .btn {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn:hover {
        opacity: 0.88;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-secondary {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
      }

      #status {
        display: none;
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
      }
      #status.success {
        background: rgba(34, 197, 94, 0.12);
        color: var(--success);
      }
      #status.error {
        background: rgba(239, 68, 68, 0.12);
        color: var(--error);
      }

      .spinner-wrap {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>✈ OCR AutoFill</h1>
      <p class="sub">
        Selecione ou arraste uma imagem com os dados do passageiro
      </p>

      <div id="drop-zone">
        <div class="icon">📄</div>
        <p>Arraste aqui ou clique para escolher</p>
        <small>PNG, JPG ou WEBP • máx. 5MB</small>
      </div>
      <input
        type="file"
        id="file-input"
        accept="image/png,image/jpeg,image/webp"
      />

      <div id="preview-box">
        <img id="preview-img" alt="Preview" />
        <button class="btn btn-secondary" id="btn-change">Trocar imagem</button>
      </div>

      <div class="spinner-wrap" id="spinner">
        <div class="spinner"></div>
        <span>Processando OCR...</span>
      </div>

      <div id="status"></div>
    </div>

    <script src="upload.js" type="module"></script>
  </body>
</html>
