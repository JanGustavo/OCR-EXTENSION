<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR Passagens</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0c10;
        --surface: #12151c;
        --surface-hover: #16191f;
        --border: #1f242d;
        --border-light: #2a2f3a;
        --accent: #4f46e5;
        --accent-hover: #6366f1;
        --accent-rgb: 79, 70, 229;
        --accent-alt-rgb: 16, 185, 129;
        --accent-light: rgba(var(--accent-rgb), 0.12);
        --accent-ring: rgba(var(--accent-rgb), 0.28);
        --success: #10b981;
        --success-light: rgba(16, 185, 129, 0.1);
        --error: #ef4444;
        --error-light: rgba(239, 68, 68, 0.1);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --text-subtle: #64748b;
        --font-heading: "Bahnschrift", "Segoe UI", sans-serif;
        --font-body: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background:
          radial-gradient(
            circle at 10% 0%,
            rgba(var(--accent-rgb), 0.2),
            transparent 35%
          ),
          radial-gradient(
            circle at 90% 100%,
            rgba(var(--accent-alt-rgb), 0.16),
            transparent 40%
          ),
          linear-gradient(135deg, var(--bg) 0%, #0d0f14 100%);
        color: var(--text-primary);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 24px 16px;
        line-height: 1.5;
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* MAIN CONTAINER */
      /* ──────────────────────────────────────────────────────────────── */

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        width: 100%;
        max-width: 900px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* HEADER */
      /* ──────────────────────────────────────────────────────────────── */

      h1 {
        font-size: 28px;
        font-weight: 700;
        font-family: var(--font-heading);
        margin-bottom: 8px;
        letter-spacing: -0.5px;
        background: linear-gradient(
          135deg,
          var(--text-primary) 0%,
          rgba(var(--accent-rgb), 0.95) 65%,
          rgba(var(--accent-alt-rgb), 0.9) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .sub {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 32px;
        font-weight: 400;
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* UPLOAD SECTION */
      /* ──────────────────────────────────────────────────────────────── */

      #upload-section {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      #upload-section.hidden {
        display: none;
      }

      #drop-zone {
        border: 2px dashed var(--border-light);
        border-radius: 16px;
        padding: 48px 32px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(var(--accent-rgb), 0.04);
        position: relative;
        overflow: hidden;
      }

      #drop-zone::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          circle at center,
          rgba(var(--accent-rgb), 0.11),
          transparent
        );
        pointer-events: none;
      }

      #drop-zone:hover {
        border-color: var(--accent);
        background: var(--accent-light);
      }

      .icon {
        font-size: 48px;
        margin-bottom: 16px;
        display: inline-block;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      #drop-zone p {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--text-primary);
      }

      #drop-zone small {
        color: var(--text-subtle);
        font-size: 13px;
        font-weight: 400;
      }

      #file-input {
        display: none;
      }

      .paste-help {
        margin-top: 12px;
        color: var(--text-subtle);
        font-size: 12px;
        text-align: center;
      }

      #preview-box {
        display: none;
        margin-top: 24px;
        text-align: center;
        padding: 20px;
        background: var(--surface-hover);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      #preview-box img {
        max-width: 100%;
        max-height: 300px;
        border-radius: 12px;
        border: 1px solid var(--border-light);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* SPINNER & STATUS */
      /* ──────────────────────────────────────────────────────────────── */

      .spinner-wrap {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 500;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #status {
        display: none;
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #status.success {
        background: var(--success-light);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.2);
      }

      #status.error {
        background: var(--error-light);
        color: var(--error);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* BUTTONS */
      /* ──────────────────────────────────────────────────────────────── */

      .btn {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        text-align: center;
        letter-spacing: 0.3px;
        position: relative;
        overflow: hidden;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.1);
        transition: left 0.3s ease;
        pointer-events: none;
      }

      .btn:hover::before {
        left: 100%;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-hover));
        color: #fff;
        box-shadow: 0 4px 15px rgba(var(--accent-rgb), 0.35);
      }

      .btn-primary:hover {
        box-shadow: 0 6px 20px rgba(var(--accent-rgb), 0.45);
        transform: translateY(-1px);
      }

      .btn-primary:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(var(--accent-rgb), 0.3);
      }

      .btn-secondary {
        background: var(--surface-hover);
        border: 1px solid var(--border-light);
        color: var(--text-secondary);
      }

      .btn-secondary:hover {
        background: var(--border);
        border-color: var(--accent);
        color: var(--text-primary);
      }

      .btn-secondary:active {
        background: var(--surface);
      }

      .btn-danger {
        background: var(--error-light);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--error);
      }

      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.2);
        border-color: var(--error);
      }

      .btn-danger:active {
        background: var(--error-light);
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* RESULT SECTION */
      /* ──────────────────────────────────────────────────────────────── */

      #result-section {
        display: none;
      }

      #result-section.section {
        display: block;
      }

      .result-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }

      .result-header h3 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.3px;
      }

      .result-header small {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
        background: var(--accent-light);
        padding: 4px 10px;
        border-radius: 6px;
        letter-spacing: 0.3px;
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* PASSENGER SUMMARY CARDS */
      /* ──────────────────────────────────────────────────────────────── */

      .passenger-summary {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
        margin-bottom: 28px;
        padding: 16px;
        background: var(--surface-hover);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .passenger-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 14px 12px;
        border: 1.5px solid var(--border-light);
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          rgba(18, 21, 28, 0.8),
          rgba(10, 12, 16, 0.8)
        );
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        min-height: 130px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .passenger-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          circle at top-right,
          rgba(var(--accent-rgb), 0.09),
          transparent
        );
        pointer-events: none;
      }

      .passenger-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        background: linear-gradient(
          135deg,
          rgba(18, 21, 28, 0.95),
          rgba(10, 12, 16, 0.95)
        );
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }

      .passenger-card.active {
        border-color: var(--accent-hover);
        box-shadow:
          0 0 0 2px var(--accent-ring),
          0 12px 30px rgba(var(--accent-rgb), 0.3);
        background: linear-gradient(
          135deg,
          rgba(18, 21, 28, 1),
          rgba(10, 12, 16, 1)
        );
      }

      .passenger-card .thumb {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        background: linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.35),
          rgba(var(--accent-alt-rgb), 0.26)
        );
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.28);
      }

      .passenger-card .title {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--text-primary);
        letter-spacing: -0.2px;
      }

      .passenger-card .name {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        min-height: 28px;
        line-height: 1.35;
        word-break: break-word;
      }

      .passenger-card .card-status {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding: 5px 10px;
        border-radius: 6px;
        margin-top: auto;
      }

      .passenger-card.filled .card-status {
        background: var(--success-light);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .passenger-card.empty .card-status {
        background: rgba(100, 116, 139, 0.08);
        color: var(--text-subtle);
        border: 1px solid rgba(100, 116, 139, 0.2);
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* FORM FIELDS */
      /* ──────────────────────────────────────────────────────────────── */

      .form-group {
        margin-bottom: 16px;
      }

      #result-section label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .optional-badge {
        font-size: 10px;
        color: var(--text-subtle);
        font-weight: 400;
        margin-left: 4px;
        text-transform: none;
        letter-spacing: 0;
      }

      #result-section input,
      #result-section select {
        display: block;
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--border-light);
        border-radius: 8px;
        background: var(--surface-hover);
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 400;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: inherit;
      }

      #result-section input::placeholder,
      #result-section select::placeholder {
        color: var(--text-subtle);
      }

      #result-section input:hover,
      #result-section select:hover {
        border-color: var(--border);
        background: var(--surface);
      }

      #result-section input:focus,
      #result-section select:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--surface);
        box-shadow: 0 0 0 3px var(--accent-ring);
      }

      #result-section input:disabled,
      #result-section select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #result-section select option {
        background: var(--surface);
        color: var(--text-primary);
      }

      .contact-fields {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px dashed var(--border);
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* UTILITY CLASSES */
      /* ──────────────────────────────────────────────────────────────── */

      .section {
        display: block;
      }

      .section.hidden {
        display: none;
      }

      .hidden {
        display: none !important;
      }

      /* ──────────────────────────────────────────────────────────────── */
      /* RESPONSIVE */
      /* ──────────────────────────────────────────────────────────────── */

      @media (max-width: 768px) {
        .card {
          padding: 24px;
          border-radius: 16px;
        }

        h1 {
          font-size: 24px;
        }

        #drop-zone {
          padding: 36px 24px;
        }

        .icon {
          font-size: 40px;
        }

        .passenger-summary {
          grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
          gap: 10px;
        }

        .passenger-card {
          min-height: 120px;
          padding: 12px 10px;
        }

        .btn {
          padding: 11px 14px;
          font-size: 13px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 20px;
          border-radius: 12px;
        }

        h1 {
          font-size: 22px;
        }

        .sub {
          font-size: 13px;
          margin-bottom: 24px;
        }

        #drop-zone {
          padding: 32px 20px;
        }

        .icon {
          font-size: 36px;
          margin-bottom: 12px;
        }

        .passenger-summary {
          grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
          gap: 8px;
          padding: 12px;
        }

        .passenger-card {
          min-height: 110px;
          padding: 10px 8px;
          gap: 6px;
        }

        .passenger-card .thumb {
          width: 40px;
          height: 40px;
          font-size: 16px;
        }

        .passenger-card .title {
          font-size: 12px;
        }

        .passenger-card .name {
          font-size: 10px;
        }

        .result-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }

        .btn {
          padding: 10px 12px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="page-heading">✈ OCR Passagens</h1>
      <p class="sub">Selecione uma imagem com os dados do passageiro</p>

      <!-- ─── Upload Section ─── -->
      <div id="upload-section" class="section">
        <div id="drop-zone">
          <div class="icon">📄</div>
          <p>Clique para escolher uma imagem</p>
          <small>PNG, JPG ou WEBP • máx. 5MB • ou cole com Ctrl+V</small>
        </div>
        <input
          type="file"
          id="file-input"
          accept="image/png,image/jpeg,image/webp"
        />
        <button class="btn btn-secondary" id="btn-paste-image" type="button">
          Colar imagem da área de transferência
        </button>
        <div class="paste-help">
          Dica: copie uma imagem e pressione Ctrl+V nesta tela.
        </div>

        <div id="preview-box">
          <img id="preview-img" alt="Preview" />
          <button class="btn btn-secondary" id="btn-change">
            Trocar imagem
          </button>
        </div>

        <div class="spinner-wrap" id="spinner">
          <div class="spinner"></div>
          <span>Processando OCR...</span>
        </div>

        <div id="upload-status"></div>
      </div>

      <!-- ─── Result Section ─── -->
      <div id="result-section" class="section">
        <div class="result-header">
          <h3>Passageiros</h3>
          <small id="passenger-counter">0 de 9</small>
        </div>

        <div id="passenger-summary" class="passenger-summary"></div>

        <button class="btn btn-secondary" id="btn-select-image">
          Selecionar imagem do passageiro atual
        </button>

        <div class="form-group">
          <label>Nome Completo</label>
          <input
            type="text"
            id="field-nome"
            placeholder="Primeiro nome e sobrenome"
          />
        </div>

        <div class="form-group">
          <label>CPF</label>
          <input type="text" id="field-cpf" placeholder="XXX.XXX.XXX-XX" />
        </div>

        <div class="form-group">
          <label>Data de Nascimento</label>
          <input type="text" id="field-data" placeholder="DD/MM/YYYY" />
        </div>

        <div id="contact-fields" class="contact-fields hidden">
          <div class="form-group">
            <label>E-mail</label>
            <input
              type="email"
              id="field-email"
              placeholder="email@exemplo.com"
            />
          </div>

          <div class="form-group">
            <label>Telefone</label>
            <input
              type="text"
              id="field-telefone"
              placeholder="(11) 99999-9999"
            />
          </div>
        </div>

        <div class="form-group">
          <label>
            Gênero
            <span class="optional-badge" id="genero-hint"
              >(opcional — preenche o select do provedor)</span
            >
          </label>
          <select id="field-genero">
            <option value="">Não informar</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            Nacionalidade
            <span class="optional-badge">(padrão: Brasil)</span>
          </label>
          <select id="field-nacionalidade">
            <option value="Brasil">Brasil</option>
            <option value="Americana">Americana</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Argentina">Argentina</option>
            <option value="Outra">Outra</option>
          </select>
        </div>

        <button class="btn btn-primary" id="btn-upload-more">
          + Adicionar outro passageiro
        </button>
        <button class="btn btn-secondary" id="btn-back">Voltar</button>
        <button class="btn btn-danger" id="btn-clear-passenger">
          🗑 Limpar passageiro atual
        </button>
        <button
          class="btn btn-primary"
          id="btn-finish"
          style="
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
          "
        >
          ✓ Finalizar e ir ao formulário
        </button>

        <div id="result-status"></div>
      </div>
    </div>

    <script src="upload.js" type="module"></script>
  </body>
</html>
